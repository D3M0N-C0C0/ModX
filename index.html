<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ModX</title>
<link rel="icon" href="Media/ChromeHeart.ico" type="image/x-icon">
<link rel="icon" href="Media/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;
--card:#fff;
--ink:#000;
--mute:#666;
--line:#d9d9d9;
--btn:#000;
--btn-ink:#fff;
box-sizing:border-box;
padding-top:env(safe-area-inset-top,0px);
padding-bottom:env(safe-area-inset-bottom,0px)
 }
 
@media (prefers-color-scheme:dark){
:root:not([data-theme="dark"])
{--bg:#000;
--card:#0e0e0e;
--ink:#fff;
--mute:#999;
--line:#2a2a2a;
--btn:#fff;
--btn-ink:#000}
}

:root[data-theme="dark"]{
--bg:#000;
--card:#0e0e0e;
--ink:#fff;
--mute:#999;
--line:#2a2a2a;
--btn:#fff;
--btn-ink:#000
}

html{
scroll-padding-top:env(safe-area-inset-top,0px);
scroll-behavior:smooth
}
*{box-sizing:border-box}

body{
margin:0;
background:var(--bg);
color:var(--ink);
font-family:"Archivo",system-ui,Arial,sans-serif
}

.hero{position:relative;
min-height:min(62vh,460px);
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:30px;
padding-top:40px;
text-align:center}


#waves{
position:fixed;
inset:0;
width:100%;
height:100%;
z-index:-1;
pointer-events:none
}

.hero h1{
position:relative;margin:0;
padding:0 20px;
max-width:760px;
color:var(--ink);
font-weight:900;
font-size:clamp(28px,5.2vw,56px);
line-height:1.08;text-transform:uppercase;
letter-spacing:.01em;
animation:glow 1s infinite alternate
}

@keyframes glow{
	from{text-shadow:0 0 0px var(--ink),0 0 5px var(--ink)}
	to{text-shadow:0 0 5px var(--ink),0 0 5px var(--ink)}}

.hero h1 span{display:inline-block;opacity:0;transform:translateY(28px);animation:up .7s cubic-bezier(.2,.8,.2,1) forwards}

@keyframes up{to{opacity:1;transform:none}}

.foot-logo{display:block;margin:0 auto 12px;height:140px;width:auto}

section{
max-width:1040px;
margin:0 auto;
padding:56px 20px
}

hr.divider {
  max-width: 1040px;
  width: calc(100% - 40px);
  margin: 0 auto;
  border: 0;
  height: 10px;
  background: linear-gradient(90deg,#000000 0%,#000000 25%,#ffffff 50%,#000000 75%,#000000 100%);
  background-size: 200% 100%;
  animation: divflow 3s linear infinite;
  border-radius: 9999px;
  transform: scaleX(0);
  transform-origin: right;
  transition: transform 1s cubic-bezier(.2,.8,.2,1);
  opacity: 1;
}

hr.divider.in{transform:scaleX(1)}
@keyframes divflow{to{background-position:100% 0}}

h2{margin:0 0 32px;
text-align:center;
font-weight:900;
font-size:24px;
text-transform:uppercase
}

.grid{display:grid;
grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
gap:22px}

.card{
background:var(--card);
border:1px solid var(--line);
border-radius:14px;
padding:22px;text-align:center;
transition:transform .25s ease,box-shadow .25s ease;
transform-style:preserve-3d
}
.card:hover{
box-shadow:0 18px 40px -18px rgba(0,0,0,.45)
}
.ico{width:96px;
height:96px;
margin:4px auto 16px;
border-radius:24px;
display:grid;place-items:center;
font-size:40px;font-weight:900;
color:var(--btn-ink);
background:var(--btn)
}

.ico{overflow:hidden}

.ico img{width:100%;height:100%;object-fit:cover}

.card:hover .ico{animation:wob .6s ease}

@keyframes wob{30%{transform:rotate(-8deg) scale(1.08)}60%{transform:rotate(6deg) scale(1.08)}}

.card h3{
margin:0 0 6px;
font-size:16px;
text-transform:uppercase
}

.card p{
margin:0 0 18px;
color:var(--mute);
font-size:14px;
min-height:40px
}

.btn{
position:relative;
display:block;
border:2px solid var(--btn);
overflow:hidden;
padding:12px 16px;
border-radius:8px;
background:var(--btn);
color:var(--btn-ink);
font-weight:900;font-size:13px;text-transform:uppercase;text-decoration:none;isolation:isolate;transition:transform .15s
}

.btn::before{
content:"";
position:absolute;
inset:0;
background:var(--btn-ink);
transform:translateX(-101%);
transition:transform .35s cubic-bezier(.2,.8,.2,1);z-index:-1
}

.btn:hover,.btn:focus-visible{color:var(--btn)}

.btn.ghost{margin-top:10px;background:transparent;color:var(--ink);border-color:var(--line)}

.btn.ghost::before{background:var(--ink)}

.btn.ghost:hover,.btn.ghost:focus-visible{color:var(--bg);border-color:var(--ink)}

.btn:hover::before,.btn:focus-visible::before{transform:none}

.btn:active{transform:scale(.96)}

.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

.btn.done{background:#555;border-color:#555;color:#fff}

.warn{display:flex;gap:10px;justify-content:center;align-items:center}

.warn b{
animation:pulse 1.4s ease-in-out infinite
}

@keyframes pulse{50%{opacity:.25}}

.reveal{
opacity:0;
transform:translateY(24px);
transition:opacity .6s,transform .6s
}

.reveal.in{
opacity:1;
transform:none
}

footer{
padding:32px 20px 48px;
text-align:center;
color:var(--mute);
font-size:13px
}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.hero h1 span,.reveal,hr.divider{opacity:1;transform:none}}

</style>
</head>
<body>
<canvas id="waves" aria-hidden="true"></canvas>
<header class="hero">
  <h1 id="title">Once you step into this world there's no going back</h1>
  <video class="foot-logo" src="Media/ChromeLogoSilver-nobg.webm" autoplay muted loop playsinline aria-label="ModX"></video>
</header>

<section>
  <h2>For beginners</h2>
  <div class="grid" id="g1"></div>
</section>
<hr class="divider reveal" aria-hidden="true">
<section>
  <h2 class="warn"><b>!!</b> Experts only <b>!!</b></h2>
  <div class="grid" id="g2"></div>
</section>
<footer>
<video class="foot-logo" src="Media/ChromeLogoSilver-nobg.webm" autoplay muted loop playsinline aria-label="ModX"></video>
ModX &middot;
Need help?
<a href="https://discord.gg/SUAMyr5NHy" style="color: var(--ink)" target="_blank">JOIN IN MY DISCORD HERE</a> 
</footer>

<script>
// 1) Titolo: parole che entrano una dopo l'altra
const t=document.getElementById('title');
t.innerHTML=t.textContent.split(' ').map((w,i)=>`<span style="animation-delay:${i*90}ms">${w}</span>`).join(' ');

// 2) Onde animate a tutta pagina (canvas fisso, seguono lo scroll e il tema)
const c=document.getElementById('waves'),x=c.getContext('2d');
let W,H,tick=0,rgb='0,0,0',n=0;
function size(){const d=devicePixelRatio||1;W=c.width=innerWidth*d;H=c.height=innerHeight*d}
size();addEventListener('resize',size);
function draw(){
  if(n++%30===0)rgb=getComputedStyle(document.documentElement).getPropertyValue('--ink').trim().toLowerCase()==='#fff'?'255,255,255':'0,0,0';
  const dark=rgb==='255,255,255',ph=tick+scrollY*.0015;
  x.clearRect(0,0,W,H);
  for(let l=0;l<11;l++){
    x.beginPath();
    for(let i=0;i<=W;i+=12){
      const y=H*(.1+l*.08)+Math.sin(i*.003+ph+l*.7)*H*.05+Math.sin(i*.009-ph*1.3+l)*H*.02;
      i?x.lineTo(i,y):x.moveTo(i,y);
    }
    x.strokeStyle=`rgba(${rgb},${(l%4==0?.28:.1)*(dark?1.4:1)})`;
    x.lineWidth=2;x.stroke();
  }
  tick+=.008;if(!matchMedia('(prefers-reduced-motion:reduce)').matches)requestAnimationFrame(draw);
}
draw();

// 3) Schede (contenuti segnaposto: cambiali qui)
// l = download link, t = YouTube tutorial link
const beginners=[
 {n:'Vencord',d:'The cutest Discord client mod.',l:'https://vencord.dev/download/#windows' ,t:'https://youtu.be/EGAvl-TX3zc',i:'1', img:'DiscordBlack.jpg'},
 {n:'Spicetify',d:'Make Spotify truly yours.',l:'https://spicetify.app/#install' ,t:'https://youtu.be/bQEeH65qnes',i:'2', img:'SpotifyBlack.jpg'},
 {n:'Crack world',d:'If buying isnt owning piracy isnt stealing.',l:'https://shrinkme.click/6IgIkDQ' ,t:'https://youtu.be/HwZ26pRtzrs',i:'3', img:'CrackWorld.png'},
 {n:'Crack world (STEAM FIXER)',d:'If buying isnt owning piracy isnt stealing.',l:'https://shrinkme.click/gZC8eJxR' ,t:'#',i:'4', img:'CrackWorld.png'},
 {n:'Lua tools',d:'Lets get Luing',l:'https://lua.tools/app' ,t:'https://youtu.be/qP8PNbpeh5M',i:'4', img:'SteamBlack.jpg'},
 {n:'SteamTools',d:'Fast login,game updates,multiplayer fixes.',l:'https://steamtools.net/' ,t:'https://youtu.be/vCj8NmkJrH4',i:'1', img:'SteamBlack.jpg'},
 {n:'Online fixes (COMING SOON)',d:'Free multiplayer fixes for games.',l:'#' ,t:'#',i:'1', img:'OnlineFix.mp4'}];
const experts=[
 {n:'Tweaks',d:'Manual setup required.',l:'https://github.com/ChrisTitusTech/winutil' ,t:'https://youtu.be/LF4WZQCpx1A',i:'1', img:'TweaksBlack.jpg'},
 {n:'Custom OS',d:'For those who know what they are doing.',l:'https://drive.google.com/drive/folders/1XgEjjHvwFjCo3nDBnRtZmcNyFZZa7qmJ', t:'https://youtu.be/07sI3k5U_AQ',img:'Win11Black.jpg'},
 {n:'Coming soon',d:'',l:'#',t:'#',i:'...'}];
function build(id,arr){
  document.getElementById(id).innerHTML=arr.map(a=>`
  <article class="card reveal">
    <div class="ico">${a.img ? `<img src="Media/${a.img}" alt="">` : a.i}</div>
    <h3>${a.n}</h3><p>${a.d}</p>
    <a class="btn dl" href="${a.l}" target="_blank" data-label="Download" >Download</a>
    <a class="btn ghost" href="${a.t}" target="_blank" rel="noopener">Tutorial</a>
  </article>`).join('');
}
build('g1',beginners);build('g2',experts);

// 4) Comparsa allo scroll + inclinazione 3D sulle schede
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.15});
document.querySelectorAll('.reveal').forEach((el,i)=>{el.style.transitionDelay=(i%3)*90+'ms';io.observe(el)});
document.querySelectorAll('.card').forEach(k=>{
  k.addEventListener('pointermove',e=>{const r=k.getBoundingClientRect(),px=(e.clientX-r.left)/r.width-.5,py=(e.clientY-r.top)/r.height-.5;
    k.style.transitionDelay='0ms';k.style.transform=`perspective(700px) rotateY(${px*8}deg) rotateX(${-py*8}deg) translateY(-4px)`});
  k.addEventListener('pointerleave',()=>{k.style.transform=''});
});

// 5) Feedback al click sui bottoni
document.querySelectorAll('.btn').forEach(b=>b.addEventListener('click',e=>{
  if(b.getAttribute('href')==='#')e.preventDefault();
  if(!b.classList.contains('dl'))return;
  b.classList.add('done');b.textContent='Started';
  setTimeout(()=>{b.classList.remove('done');b.textContent=b.dataset.label},1500);
}));
</script>
</body>
</html>
